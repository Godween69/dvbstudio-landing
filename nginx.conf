# front/nginx.conf
# Конфиг nginx внутри контейнера land-frontend (статический сайт)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Не показываем версию nginx в заголовках
    server_tokens off;

    # Базовые заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Сжатие текстовых файлов
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # SPA: любые пути отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Файлы для поисковиков и превью ссылок: имена без хеша, поэтому кэш короткий.
    # Заголовки безопасности дублируем: add_header в location сбрасывает родительские.
    location = /robots.txt {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /sitemap.xml {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /og-image.png {
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Статика с хешами в именах — кэшируем надолго.
    # Заголовки безопасности дублируем: add_header в location сбрасывает родительские.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
