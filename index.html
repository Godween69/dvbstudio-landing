<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Дмитрий — независимый full-stack разработчик: React, TypeScript, NestJS, PostgreSQL, Docker. Интерфейсы, API и автоматический деплой." />

    <meta name="theme-color" content="#030712" />
    <!-- Метатеги, Open Graph и структурированные данные добавляются при сборке (scripts/prerender.mjs) -->
    <!--seo-head-->
    <!-- Тема применяется до отрисовки, чтобы не было вспышки светлой темы -->
    <script>
      try {
        document.documentElement.classList.add(localStorage.getItem('theme') === 'light' ? 'light' : 'dark')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <title>Дмитрий — Full-Stack разработчик | dvb studio</title>

    <div id="root"></div>
    <!-- Текстовая версия для роботов и режима без JavaScript добавляется при сборке -->

  </body>
